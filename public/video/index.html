<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>5BX cadet run</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #101418;
        color: #f6e7c1;
        font-family: "Oswald", Impact, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1rem;
        box-sizing: border-box;
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      video {
        width: min(100%, 960px);
        max-height: 78dvh;
        background: #000;
      }
      a {
        color: #f6e7c1;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap"
    />
  </head>
  <body>
    <main>
      <h1>Cadet run</h1>
      <video src="cadet-run.mp4" controls playsinline loop></video>
      <a href="../">Back to the timer</a>
    </main>
  </body>
</html>
